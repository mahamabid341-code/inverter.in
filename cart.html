<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - inverter.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0A2540',
                        'navy-dark': '#071A2F',
                        electric: '#2563EB',
                        accent: '#F59E0B',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-navy text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="text-2xl font-bold tracking-tight">
                    inverter<span class="text-accent">.in</span>
                </a>
                <div class="flex items-center gap-4">
                    <a href="cart.html" class="relative hover:text-accent transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <span class="cart-count absolute -top-2 -right-2 bg-accent text-navy text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- TITLE -->
    <div class="bg-white border-b">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <h1 class="text-2xl md:text-3xl font-bold text-navy">Shopping Cart</h1>
            <p class="text-slate-500 text-sm mt-1">Your selected products</p>
        </div>
    </div>

    <!-- CART -->
    <section class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- LEFT: Items -->
            <div id="cart-items" class="lg:col-span-2 space-y-4">
                <!-- JS yahan items dikhayega -->
            </div>

            <!-- RIGHT: Summary -->
            <div id="order-summary" class="lg:col-span-1">
                <!-- JS yahan summary dikhayega -->
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-navy-dark text-white py-8 mt-8">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-slate-400 text-sm">© 2026 inverter.in — All Rights Reserved</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
