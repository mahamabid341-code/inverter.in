<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - inverter.in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header style="background: #0b2545; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <a href="index.html" style="color: #fca311; font-weight: bold; font-size: 22px; text-decoration: none;">inverter<span style="color: #fff;">.in</span></a>
        <a href="cart.html" style="color: white; text-decoration: none; font-size: 20px;">
            🛒 <span class="cart-count" style="background: #fca311; color: white; padding: 2px 7px; border-radius: 50%; font-size: 13px; font-weight: bold;">0</span>
        </a>
    </header>

    <!-- Page Title Banner -->
    <div style="background: #eef2f5; padding: 25px 20px; border-bottom: 1px solid #ddd;">
        <div style="max-width: 1050px; margin: 0 auto;">
            <h1 style="margin: 0; color: #0b2545; font-size: 26px;">Shopping Cart</h1>
            <p style="margin: 5px 0 0 0; color: #666; font-size: 14px;">Your selected products</p>
        </div>
    </div>

    <!-- Main Cart Container Jisme JS Data Dalege -->
    <main>
        <div id="cart-items-container"></div>
    </main>

    <!-- Footer -->
    <footer style="background: #0b2545; color: #8892b0; text-align: center; padding: 20px; margin-top: 50px; font-size: 14px;">
        © 2026 inverter.in — All Rights Reserved
    </footer>

    <!-- Main JavaScript File -->
    <script src="js/main.js"></script>
</body>
</html>
