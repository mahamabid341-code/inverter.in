<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - inverter.in</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Open Sans', 'Segoe UI', sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #0b2545; padding: 16px 35px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .logo { color: #fff; font-size: 22px; font-weight: 800; text-decoration: none; }
        .logo span { color: #fca311; }
        .cart-icon-btn { color: white; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .cart-count { background: #1e88e5; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
        .banner { background: #ffffff; padding: 30px 35px; border-bottom: 1px solid #e2e8f0; }
        .banner h1 { font-size: 24px; color: #0b2545; font-weight: 800; }
        .banner p { color: #64748b; font-size: 13.5px; margin-top: 4px; }
        main { flex: 1; padding: 0 20px; }
        footer { background: #0b2545; color: #94a3b8; text-align: center; padding: 20px; font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ inverter<span>.in</span></a>
        <a href="cart.html" class="cart-icon-btn">
            <i class="fa-solid fa-cart-shopping"></i> My Cart <span class="cart-count">0</span>
        </a>
    </header>

    <div class="banner">
        <div style="max-width: 1100px; margin: 0 auto;">
            <h1>Shopping Cart</h1>
            <p>Review items in your cart and proceed to checkout.</p>
        </div>
    </div>

    <main>
        <div id="cart-items-container"></div>
    </main>

    <footer>
        © 2026 inverter.in — Industrial Automation & Inverter Solutions
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
