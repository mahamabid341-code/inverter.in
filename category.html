<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - inverter.in</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; color: #1e293b; }
        
        header { background: #0b2545; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fca311; font-weight: 800; font-size: 22px; text-decoration: none; }
        .logo span { color: #ffffff; }
        .cart-link { color: white; text-decoration: none; font-size: 16px; font-weight: 600; }
        .cart-badge { background: #1e88e5; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }

        .banner { padding: 30px 40px; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .banner h1 { font-size: 26px; color: #0b2545; font-weight: 800; }
        .banner p { color: #64748b; font-size: 14px; margin-top: 4px; }

        .products-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }

        .img-wrapper {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            background: #f1f5f9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cat-tag { font-size: 11px; font-weight: 700; color: #1e88e5; text-transform: uppercase; margin-bottom: 4px; }
        .prod-title { font-size: 15px; font-weight: 700; color: #0b2545; margin-bottom: 6px; }
        .prod-price { font-size: 16px; font-weight: 800; color: #1e293b; margin-bottom: 14px; }

        .btn-add-cart {
            width: 100%;
            background: #0b2545;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add-cart:hover { background: #fca311; color: #000; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">inverter<span>.in</span></a>
        <a href="cart.html" class="cart-link">🛒 Cart <span class="cart-badge cart-count">0</span></a>
    </header>

    <div class="banner">
        <h1>All Products</h1>
        <p>PLC, Servo, Inverters & more</p>
    </div>

    <!-- Yahan Javascript se photo wale products load honge -->
    <main>
        <div class="products-container" id="products-grid"></div>
    </main>

    <script src="js/main.js"></script>
    <script>
        function renderCategoryPage() {
            const grid = document.getElementById('products-grid');
            if (!grid) return;

            // Admin panel ki saved images aur products fetch karna
            const products = getActiveProducts();
            grid.innerHTML = '';

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <div class="img-wrapper">
                                <img src="${p.image || 'images/plc.jpg'}" alt="${p.name}" onerror="this.src='images/plc.jpg'">
                            </div>
                            <div class="cat-tag">${p.category || 'Automation'}</div>
                            <div class="prod-title">${p.name}</div>
                        </div>
                        <div>
                            <div class="prod-price">Rs. ${Number(p.price).toLocaleString()}</div>
                            <button class="btn-add-cart" onclick='addToCart(${JSON.stringify(p)})'>Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', renderCategoryPage);
    </script>
</body>
</html>
