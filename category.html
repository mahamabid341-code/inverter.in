<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - inverter.in</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background: #0b2545; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fca311; font-weight: 800; font-size: 22px; text-decoration: none; }
        .logo span { color: #ffffff; }
        .cart-link { color: white; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .cart-badge { background: #1e88e5; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }

        .banner { padding: 30px 40px; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .banner h1 { font-size: 26px; color: #0b2545; font-weight: 800; }
        .banner p { color: #64748b; font-size: 14px; margin-top: 4px; }

        .products-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .product-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }

        .img-wrapper {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            background: #f1f5f9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cat-tag { font-size: 11px; font-weight: 700; color: #1e88e5; text-transform: uppercase; margin-bottom: 4px; }
        .prod-title { font-size: 15px; font-weight: 700; color: #0b2545; margin-bottom: 6px; }
        .prod-price { font-size: 16px; font-weight: 800; color: #1e293b; margin-bottom: 14px; }

        .btn-add-cart {
            width: 100%;
            background: #0b2545;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add-cart:hover { background: #fca311; color: #000; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">inverter<span>.in</span></a>
        <a href="cart.html" class="cart-link">🛒 Cart <span class="cart-badge" id="nav-cart-count">0</span></a>
    </header>

    <div class="banner">
        <h1>All Products</h1>
        <p>PLC, Servo, Inverters & more</p>
    </div>

    <main>
        <div class="products-container" id="products-grid"></div>
    </main>

    <script>
        // Fallback default products agar admin panel se koi custom data na mila ho
        const defaultProducts = [
            { id: 101, name: "Delta DVP14SS2 PLC", price: 18500, category: "PLC Controllers", image: "images/plc.jpg" },
            { id: 102, name: "Delta ASD-B2 Servo", price: 42000, category: "Servo Motors", image: "images/servo.jpg" },
            { id: 103, name: "VFD Drive 2.2 kW", price: 28900, category: "VFD Inverters", image: "images/vfd.jpg" },
            { id: 104, name: "DOP-B07 HMI Screen", price: 35500, category: "HMI Screens", image: "images/hmi.jpg" }
        ];

        function getStoreProducts() {
            const saved = localStorage.getItem('site_products');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.length > 0) return parsed;
                } catch(e) {}
            }
            return defaultProducts;
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const count = cart.reduce((total, item) => total + (Number(item.quantity) || 1), 0);
            const badge = document.getElementById('nav-cart-count');
            if (badge) badge.innerText = count;
        }

        function addToCartDirect(id) {
            const products = getStoreProducts();
            const prod = products.find(p => p.id == id);
            if (!prod) return;

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const idx = cart.findIndex(c => c.id == prod.id || c.name == prod.name);

            if (idx > -1) {
                cart[idx].quantity = (Number(cart[idx].quantity) || 1) + 1;
            } else {
                cart.push({ ...prod, quantity: 1 });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            alert(`${prod.name} cart mein add ho gaya!`);
        }

        function renderCategoryPage() {
            const grid = document.getElementById('products-grid');
            if (!grid) return;

            const products = getStoreProducts();
            grid.innerHTML = '';

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <div class="img-wrapper">
                                <img src="${p.image || 'images/plc.jpg'}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                            </div>
                            <div class="cat-tag">${p.category || 'Automation'}</div>
                            <div class="prod-title">${p.name}</div>
                        </div>
                        <div>
                            <div class="prod-price">Rs. ${Number(p.price).toLocaleString()}</div>
                            <button class="btn-add-cart" onclick="addToCartDirect(${p.id})">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryPage();
            updateCartBadge();
        });
    </script>
</body>
</html>
