backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Product Title", name: "title", widget: "string" }
      - { label: "Price (Rs.)", name: "price", widget: "number", value_type: "int" }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Brand / Category", name: "brand", widget: "select", options: ["Delta", "VFD Inverter", "Servo Motor", "PLC Controller", "Other"] }
      - { label: "Short Specifications", name: "specs", widget: "string", required: false }
      - { label: "Full Description", name: "description", widget: "text" }
      - { label: "In Stock", name: "inStock", widget: "boolean", default: true }